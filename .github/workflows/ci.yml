name: CI-CD

# Controls when the action will run.
on:
  push

jobs:
  build-test:
    runs-on: macos-15
    container:
      image: yanzhaowang/r3bdev:fedora-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: testing
        run: |
          ${SIMPATH}/bin/root -l test.C
